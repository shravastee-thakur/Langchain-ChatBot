[project]
name = "langchainchatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shravastee Thakur", email = "shravastee@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.19",
    "langchain>=1.4.2",
    "langchain-groq>=1.1.3",
    "langchain-text-splitters>=1.1.2",
    "numpy>=2.5.3",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[project.scripts]
langchainchatbot = "langchainchatbot:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
